spring.application.name=ToDoListBackend

# Puerto del servidor
server.port=8080

# Base de datos H2 guardada en archivo (no se borra al apagar)
spring.datasource.url=jdbc:h2:file:./data/tareasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver las tablas desde el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate crea y actualiza las tablas solito
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Apaga el aviso amarillo
spring.jpa.open-in-view=false